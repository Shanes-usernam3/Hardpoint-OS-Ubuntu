name: Build HardPoint OS (Zorin Edition) ISO

on:
  workflow_dispatch:          # "Run workflow" button on GitHub
  push:
    branches: [main]          # every push to main builds a fresh ISO
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  HIMMELBLAU_TAG: '4.0.5'     # Microsoft Entra ID sign-in (pinned upstream release)

jobs:
  himmelblau:
    name: Build Entra sign-in packages
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Reuse packages if this release was already built
        id: cache
        uses: actions/cache@v4
        with:
          path: extra-pkgs
          key: himmelblau-ubuntu24.04-${{ env.HIMMELBLAU_TAG }}-${{ hashFiles('tools/build-himmelblau.sh') }}

      - name: Build Himmelblau
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash tools/build-himmelblau.sh extra-pkgs

      - uses: actions/upload-artifact@v4
        with:
          name: himmelblau-debs
          path: extra-pkgs/*.deb
          retention-days: 7

  build:
    needs: himmelblau
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null || true
          sudo mkdir -p /mnt/hp && sudo chown "$USER" /mnt/hp
          df -h / /mnt

      - name: Reuse the downloaded Zorin OS Core ISO
        uses: actions/cache@v4
        with:
          path: /mnt/hp/cache
          key: zorin-${{ hashFiles('config/base.env') }}

      - name: Get the Entra sign-in packages
        uses: actions/download-artifact@v4
        with:
          name: himmelblau-debs
          path: extra-pkgs

      - name: Build the ISO
        run: sudo env CACHE=/mnt/hp/cache WORK=/mnt/hp/work OUT="$PWD/out" bash ./build.sh

      - name: Save the build report to the build-report branch
        if: always()
        run: |
          mkdir -p report && cp out/build-report.txt report/ 2>/dev/null || echo "no report" > report/build-report.txt
          cd report && git init -q -b build-report
          git config user.name "HardPoint CI"; git config user.email "ci@hardpoint.invalid"
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (commit ${{ github.sha }})" >> build-report.txt
          git add -A && git commit -qm "Build report for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-report

      - name: Free the work area
        if: always()
        run: sudo rm -rf /mnt/hp/work; sudo chown -R "$USER" /mnt/hp/cache || true

      - name: Upload ISO (download from this run's page)
        uses: actions/upload-artifact@v4
        with:
          name: hardpoint-os-zorin-iso
          path: |
            out/*.iso
            out/SHA256SUMS
          compression-level: 0
          retention-days: 14

  test:
    name: Test in a VM
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space and enable KVM
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf libarchive-tools python3-pil

      - uses: actions/download-artifact@v4
        with:
          name: hardpoint-os-zorin-iso
          path: iso

      - name: Boot live, install, boot the installed system
        run: python3 tools/vm-test.py iso/*.iso results

      - name: Save results to the test-results branch
        if: always()
        run: |
          cd results
          git init -q -b test-results
          git config user.name "HardPoint CI"; git config user.email "ci@hardpoint.invalid"
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (commit ${{ github.sha }})" >> summary.md
          git add -A && git commit -qm "VM test results for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" test-results
