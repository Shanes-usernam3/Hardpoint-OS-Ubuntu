name: Build HardPoint OS ISO

# Every push: build + publish the hardpoint-os update (a few minutes).
# Full ISO + VM test (about 2 hours): "Run workflow" button, a v* tag, or "[iso]" in the commit message.
on:
  workflow_dispatch:          # "Run workflow" button on GitHub
    inputs:
      version:
        description: 'Release version, e.g. 1.0.0 — publishes an official release on the Releases page (leave empty for a test ISO)'
        required: false
        default: ''

  push:
    branches: [main, hardpoint-2]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  HIMMELBLAU_TAG: '4.0.6'     # Microsoft Entra ID sign-in (pinned upstream release)

jobs:
  package:
    name: Build the hardpoint-os update package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: ver
        run: source config/base.env && echo "version=$HP_BASE_VERSION.$(date -u +%Y%m%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Build package
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil python3-numpy fonts-inter librsvg2-bin >/dev/null
          HP_PKG_VERSION=${{ steps.ver.outputs.version }} bash tools/build-deb.sh hp-pkg
          dpkg-deb -I hp-pkg/*.deb | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: hardpoint-os-deb
          path: hp-pkg/*.deb
          retention-days: 30

  publish:
    name: Publish the update (HardPoint Updates on installed PCs)
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hardpoint-os-deb
          path: hp-pkg
      - name: Publish signed update to GitHub Pages
        env:
          HP_SIGNING_KEY: ${{ secrets.HP_SIGNING_KEY }}
          HP_PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          sudo apt-get install -y -qq apt-utils >/dev/null
          bash tools/publish-apt.sh hp-pkg/*.deb

  himmelblau:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[iso]')
    name: Build Entra sign-in packages
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Reuse packages if this release was already built
        id: cache
        uses: actions/cache@v4
        with:
          path: extra-pkgs
          key: himmelblau-ubuntu26.04-${{ env.HIMMELBLAU_TAG }}-${{ hashFiles('tools/build-himmelblau.sh') }}

      - name: Build Himmelblau
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash tools/build-himmelblau.sh extra-pkgs

      - uses: actions/upload-artifact@v4
        with:
          name: himmelblau-debs
          path: extra-pkgs/*.deb
          retention-days: 7

  build:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[iso]')
    needs: [himmelblau, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null || true
          sudo mkdir -p /mnt/hp && sudo chown "$USER" /mnt/hp
          df -h / /mnt

      - name: Reuse the downloaded base ISO
        uses: actions/cache@v4
        with:
          path: /mnt/hp/cache
          key: base-iso-${{ hashFiles('config/base.env') }}

      - name: Get the Entra sign-in packages
        uses: actions/download-artifact@v4
        with:
          name: himmelblau-debs
          path: extra-pkgs

      - name: Get the hardpoint-os package
        uses: actions/download-artifact@v4
        with:
          name: hardpoint-os-deb
          path: hp-pkg

      - name: Build the ISO
        run: |
          # A version tag (v1.0.0) names the ISO hardpoint-os-1.0.0-amd64.iso
          if [[ $GITHUB_REF == refs/tags/v* ]]; then export HP_VERSION="${GITHUB_REF_NAME#v}"; fi
          if [[ -n "${{ inputs.version }}" ]]; then export HP_VERSION="${{ inputs.version }}"; fi
          sudo env CACHE=/mnt/hp/cache WORK=/mnt/hp/work OUT="$PWD/out" HP_VERSION="${HP_VERSION:-}" bash ./build.sh

      - name: Save the build report to the build-report branch
        if: always()
        run: |
          mkdir -p report && cp out/build-report.txt report/ 2>/dev/null || echo "no report" > report/build-report.txt
          [[ -f out/build-log.txt ]] && sed -E 's/\x1b\[[0-9;]*m//g; s/\r/\n/g' out/build-log.txt | grep -vE '^(Get:|Hit:|Selecting previously|Preparing to unpack|Unpacking |Setting up |Processing triggers)' | tail -c 3000000 > report/build-log.txt
          cd report && git init -q -b build-report${{ github.ref_name != 'main' && format('-{0}', github.ref_name) || '' }}
          git config user.name "HardPoint CI"; git config user.email "ci@hardpoint.invalid"
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (commit ${{ github.sha }})" >> build-report.txt
          git add -A && git commit -qm "Build report for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-report${{ github.ref_name != 'main' && format('-{0}', github.ref_name) || '' }}

      - name: Free the work area
        if: always()
        run: sudo rm -rf /mnt/hp/work; sudo chown -R "$USER" /mnt/hp/cache || true

      - name: Upload ISO (download from this run's page)
        uses: actions/upload-artifact@v4
        with:
          name: hardpoint-os-iso
          path: |
            out/*.iso
            out/SHA256SUMS
          compression-level: 0
          retention-days: 14

  test:
    name: Test in a VM
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space and enable KVM
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf libarchive-tools python3-pil gdisk dosfstools squashfs-tools parted

      - uses: actions/download-artifact@v4
        with:
          name: hardpoint-os-iso
          path: iso

      - name: Boot live, install, boot the installed system
        run: python3 tools/vm-test.py iso/*.iso results

      - name: Save results to the test-results branch
        if: always()
        run: |
          cd results
          git init -q -b test-results${{ github.ref_name != 'main' && format('-{0}', github.ref_name) || '' }}
          git config user.name "HardPoint CI"; git config user.email "ci@hardpoint.invalid"
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (commit ${{ github.sha }})" >> summary.md
          git add -A && git commit -qm "VM test results for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" test-results${{ github.ref_name != 'main' && format('-{0}', github.ref_name) || '' }}

  release:
    name: Publish the release (version tags only)
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /

      - uses: actions/download-artifact@v4
        with:
          name: hardpoint-os-iso
          path: iso

      - name: Split the ISO and write the notes
        run: |
          [[ $TAG =~ ^v[0-9]+(\.[0-9]+){1,2}([.-][A-Za-z0-9]+)?$ ]] || { echo "Version must look like 1.0.0"; exit 1; }
          bash tools/make-release.sh iso/*.iso "$TAG" rel
          rm -rf iso

      - name: Publish on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" --target "$GITHUB_SHA" --title "HardPoint OS ${TAG#v}" \
            --notes-file rel/notes.md --latest \
            rel/get-hardpoint-iso.sh rel/SHA256SUMS.txt rel/SHA256SUMS-parts.txt rel/*.part*
