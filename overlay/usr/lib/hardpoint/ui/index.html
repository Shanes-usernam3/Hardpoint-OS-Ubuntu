<!doctype html>
<html lang="en">
<head>

<title>HardPoint OS</title>
<link rel="stylesheet" href="byte.css">
</head>
<body>
<div class="aurora"></div><div class="grain"></div>
<div class="shell" id="shell">

    <div class="brand"><img src="logo.svg" alt=""><div><b>HardPoint OS</b><span>HARDPOINT NETWORKS</span></div></div>
    <div class="nav" data-view="updates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>Updates</div>
