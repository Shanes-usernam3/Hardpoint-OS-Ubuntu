# HardPoint OS — I2C touchpads (Lenovo ThinkBook/IdeaPad, Synaptics/ELAN "HID over I2C").
# Make sure the Intel GPIO/LPSS drivers are ready before the touchpad driver
# starts, otherwise it can fail with "can't add hid device: -110" at boot.
softdep i2c_hid_acpi pre: pinctrl_alderlake pinctrl_tigerlake pinctrl_meteorlake intel_lpss_pci
