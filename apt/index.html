<h1>HardPoint OS updates</h1>
<p>This is the update source for HardPoint OS. Installed PCs get updates through <b>HardPoint Updates</b>.</p>
<p>To connect a PC installed before updates existed, open Terminal and run:</p>
<p><code>curl -fsSL https://shanes-usernam3.github.io/Hardpoint-OS-Ubuntu/apt/install.sh | sudo sh</code></p>
